name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Every check, including the browser suite in all three browsers.
      - run: npm run verify
      # On failure, put the unit and browser failures in the job log itself, so they can be
      # read on the run page without downloading the artifact.
      - name: Show test failures
        if: failure()
        run: |
          grep -n -B 2 -A 40 -E "FAIL |×" .planning/logs/unit.log | head -n 300 || true
          tail -n 400 .planning/logs/browsers.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verify-logs
          path: |
            .planning/VERIFY.md
            .planning/logs/
            test-results/
          include-hidden-files: true
          retention-days: 7
